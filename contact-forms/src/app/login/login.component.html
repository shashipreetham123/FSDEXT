<h1>Login</h1>
<form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="form p-2">
    <label for="username" class="form-label">Username: </label>
    <input type="text" id="username" formControlName="username" class="form-control"><br><br>
    <label for="password" class="form-label">Password: </label>
    <input type="password" id="password" formControlName="password" class="form-control"><br><br>

    <div *ngIf="contactForm.controls.username.invalid && contactForm.controls.username.touched">
        Username is Required
    </div>

    <div *ngIf="contactForm.controls.password.invalid && contactForm.controls.password.touched">
        Password is Required
    </div>

    <button class="btn btn-primary" type="submit">Login</button>
</form>
